# Sample nginx site config for 小小问题 (Tarrot)
# Domain: go4pro.org
# Place at: /etc/nginx/sites-available/tarrot
# Then: sudo ln -s /etc/nginx/sites-available/tarrot /etc/nginx/sites-enabled/tarrot
#       sudo nginx -t && sudo systemctl reload nginx

# --- HTTP -> HTTPS redirect ------------------------------------------------
server {
    listen 80;
    server_name go4pro.org www.go4pro.org;
    return 301 https://$host$request_uri;
}

# --- HTTPS (TLS) -----------------------------------------------------------
server {
    # `http2 on;` requires nginx >= 1.25.1. On older builds use `listen 443 ssl http2;`.
    listen 443 ssl;
    http2 on;
    server_name go4pro.org www.go4pro.org;

    # Certificates from certbot (see DEPLOYMENT.md section 5)
    ssl_certificate     /etc/letsencrypt/live/go4pro.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/go4pro.org/privkey.pem;

    client_max_body_size 16k;          # keep question payloads tiny

    location / {
        proxy_pass http://127.0.0.1:8787;   # must match PORT in .env
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # IMPORTANT: $remote_addr (NOT $proxy_add_x_forwarded_for). The app
        # trusts the FIRST X-Forwarded-For entry. $remote_addr replaces any
        # client-supplied value, so a client can't spoof their identity and
        # reset their per-user rate limit.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        # AI readings take a while — don't let nginx kill them early.
        proxy_read_timeout       120s;
        proxy_send_timeout       120s;
    }
}
